<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro experiment 2: Seed to Night</title>
<!-- Standalone preview. Not linked from the site. Open it in a browser from your site folder. -->
<style>
@font-face { font-family: "Jost"; src: url("assets/jost-latin.woff2") format("woff2"); font-weight: 300 500; font-display: swap; }
:root { --indigo: #120C2E; --cream: #FBF4E8; --pink: #FF4F9A; --teal: #2EC4B6; --yellow: #FFD23F; }
html, body { margin: 0; height: 100%; background: var(--cream); overflow: hidden; font-family: "Jost", system-ui, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.name { position: fixed; left: 0; top: 0; margin: 0; white-space: nowrap; font-weight: 300; text-transform: uppercase; letter-spacing: .28em; font-size: clamp(1.5rem, 4vw, 2.6rem); line-height: 1.2; color: var(--cream); will-change: transform; }
.name span { display: inline-block; will-change: transform; }
.name .dot { width: .2em; height: .2em; border-radius: 50%; background: var(--pink); vertical-align: middle; margin: 0 .38em 0 .1em; position: relative; top: -.06em; }
.tag { position: fixed; left: 0; top: 0; margin: 0; white-space: nowrap; font-weight: 500; text-transform: uppercase; letter-spacing: .24em; font-size: clamp(.62rem, 1.6vw, .78rem); color: var(--teal); will-change: transform; }
.tag span { display: inline-block; will-change: transform, filter; }
.controls { position: fixed; right: 18px; bottom: 18px; display: flex; gap: 8px; opacity: 0; transition: opacity .5s; }
.controls.on { opacity: 1; }
.controls button { font: 500 .75rem/1 "Jost", system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--indigo); background: transparent; border: 1.5px solid var(--indigo); border-radius: 999px; padding: .7em 1.2em; cursor: pointer; }
.controls button:hover { background: var(--teal); border-color: var(--teal); }
.hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); font: 500 .65rem/1 "Jost", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: rgba(18,12,46,.35); transition: opacity .4s; }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<h1 class="name" aria-label="Anna Danielson"></h1>
<p class="tag" aria-label="Sociology, Child Development, Education"></p>
<div class="hint">click to skip</div>
<div class="controls"><button type="button" id="replay">Replay</button><button type="button" id="slow">Slow-mo</button></div>
<script>
(function () {
  var cv = document.querySelector('canvas'), ctx = cv.getContext('2d');
  var nameEl = document.querySelector('.name'), tagEl = document.querySelector('.tag');
  var controls = document.querySelector('.controls'), hint = document.querySelector('.hint');
  var C = { pink: '#FF4F9A', teal: '#2EC4B6', yellow: '#FFD23F', cream: '#FBF4E8', indigo: '#120C2E' };
  var BRAND = [C.pink, C.teal, C.yellow];
  var END = 6.6;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function cl(x, a, b) { return Math.max(a === undefined ? 0 : a, Math.min(b === undefined ? 1 : b, x)); }
  function seg(t, a, b) { return cl((t - a) / (b - a)); }
  function lerp(a, b, p) { return a + (b - a) * p; }
  var E = {
    out: function (t) { return 1 - Math.pow(1 - t, 3); },
    in: function (t) { return t * t * t; },
    inOut: function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
    back: function (t) { var c = 2.2; return t <= 0 ? 0 : 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
    elastic: function (t) { return t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -8 * t) * Math.sin((t * 9 - .75) * (2 * Math.PI) / 3) + 1; },
    bounce: function (x) { var n = 7.5625, d = 2.75;
      if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
      if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; }
  };
  var seed = 11; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  // mark geometry, 120-unit box centered on 0,0
  var LINE_A = [-60, 0, 60, 120, 180, 240].map(function (d) { return d * Math.PI / 180; });
  var LINE_ORDER = [3, 0, 4, 1, 5, 2], LEAF_ORDER = [2, 5, 0, 3, 1, 4];
  function leafPath() { ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-8, -8, -8, -22, 0, -30); ctx.bezierCurveTo(8, -22, 8, -8, 0, 0); ctx.closePath(); }

  // ---------- deterministic scene data
  var roots = [], blots = [], flies = [], vinePh = [];
  function build() {
    seed = 11; roots = []; blots = []; flies = []; vinePh = [];
    function branch(x, y, ang, len, depth, t0) {
      var d = .16 + len / 900;
      var x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
      roots.push({ x: x, y: y, x2: x2, y2: y2, t0: t0, d: d, w: .6 + depth * .55, depth: depth, bud: depth === 0 ? BRAND[Math.floor(rnd() * 3)] : null });
      if (depth > 0) {
        var n = depth > 2 ? 2 : (rnd() < .6 ? 2 : 3);
        for (var i = 0; i < n; i++) branch(x2, y2, ang + (rnd() - .5) * 1.25, len * (.62 + rnd() * .22), depth - 1, t0 + d * .85);
      }
    }
    // roots are stored in mark units relative to the seed, so they scale with the mark
    for (var r = 0; r < 5; r++) branch(0, 4, Math.PI / 2 + (r - 2) * .42 + (rnd() - .5) * .2, 34 + rnd() * 14, 4, .55 + r * .05);
    for (var b = 0; b < 9; b++) blots.push({ x: (rnd() - .5) * 2.2, y: (rnd() - .5) * 1.6, r: .18 + rnd() * .3, t0: 1.4 + rnd() * 1.1, c: BRAND[b % 3], ph: rnd() * 6 });
    for (var f = 0; f < 55; f++) flies.push({ x: rnd(), y: rnd(), sp: 12 + rnd() * 30, ph: rnd() * 6.28, r: 1 + rnd() * 1.8, c: rnd() < .75 ? C.yellow : (rnd() < .5 ? C.pink : C.teal) });
    for (var v = 0; v < 6; v++) vinePh.push(rnd() * 6.28);
  }

  // ---------- layout
  var W, H, DPR, L = {}, nameW = 0, nameH = 0, tagW = 0, letters = [], words = [], letterRot = [];
  var NAME = ['A', 'N', 'N', 'A', '•', 'D', 'A', 'N', 'I', 'E', 'L', 'S', 'O', 'N'];
  var TAG = ['Sociology', '•', 'Child Development', '•', 'Education'];
  function buildText() {
    nameEl.innerHTML = ''; letters = []; letterRot = [];
    NAME.forEach(function (ch) {
      var s = document.createElement('span'); s.setAttribute('aria-hidden', 'true');
      if (ch === '•') s.className = 'dot'; else s.textContent = ch;
      nameEl.appendChild(s); letters.push(s); letterRot.push((rnd() - .5) * 70);
    });
    tagEl.innerHTML = ''; words = [];
    TAG.forEach(function (w, i) {
      var s = document.createElement('span'); s.setAttribute('aria-hidden', 'true'); s.textContent = w;
      tagEl.appendChild(s); words.push(s);
      if (i < TAG.length - 1) tagEl.appendChild(document.createTextNode(' '));
    });
    nameW = nameEl.offsetWidth; nameH = nameEl.offsetHeight; tagW = tagEl.offsetWidth;
  }
  function size() {
    DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var phone = W < 700, big = Math.min(W, H) * (phone ? .5 : .38);
    L.S0 = big / 120; L.cx = W / 2; L.cy = H * .4;
    L.n0x = (W - nameW) / 2; L.n0y = L.cy + big / 2 + Math.max(24, big * .12);
    L.t0x = (W - tagW) / 2; L.t0y = L.n0y + nameH + 14;
    L.HH = Math.max(phone ? 360 : 330, H * (phone ? .5 : .46));
    var pad = Math.max(24, (W - 1100) / 2 + 24), fm = phone ? 104 : 168;
    L.Sf = fm / 120;
    if (phone) { L.fx = pad + fm / 2; L.fy = L.HH * .34; L.nfx = pad; L.nfy = L.fy + fm / 2 + 18; L.tfx = pad; L.tfy = L.nfy + nameH + 10; }
    else { L.fx = pad + fm / 2; L.fy = L.HH / 2; L.nfx = pad + fm + 40; L.nfy = L.fy - nameH / 2 - 10; L.tfx = L.nfx; L.tfy = L.nfy + nameH + 10; }
  }

  // ---------- the mark, drawn in day (ink on paper) or night (light on navy) style
  function drawMark(t, mx, my, S, night) {
    var ink = night ? C.cream : C.indigo;
    var straight = E.inOut(seg(t, 1.75, 2.5));
    // six vines grow out wiggly, then pull taut into the mark's straight lines
    ctx.save(); ctx.translate(mx, my);
    LINE_A.forEach(function (ang, i) {
      var st = .8 + LINE_ORDER[i] * .1, p = E.out(seg(t, st, st + .65));
      if (p <= 0) return;
      var steps = 26, ux = Math.cos(ang), uy = Math.sin(ang);
      ctx.beginPath();
      for (var s = 0; s <= steps * p; s++) {
        var r = (s / steps) * 46, amp = 5 * (1 - straight) * Math.sin((s / steps) * Math.PI);
        var off = Math.sin(r * .32 + vinePh[i] + t * 3) * amp;
        var x = (ux * r - uy * off) * S, y = (uy * r + ux * off) * S;
        s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1, S * (1.05 + .55 * (1 - straight))); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
      // tip berries pop at the end of each vine
      var tp = E.back(seg(t, st + .6, st + .9));
      if (tp > 0) { ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(ux * 46 * S, uy * 46 * S, 2.4 * S * tp, 0, 6.29); ctx.fill(); }
    });
    // leaves unfurl: they stretch up first, then open wide, and sway until they settle
    for (var k = 0; k < 6; k++) {
      var st2 = 2.05 + LEAF_ORDER.indexOf(k) * .1;
      var sy = E.back(seg(t, st2, st2 + .42)), sx = E.out(seg(t, st2 + .12, st2 + .55));
      if (sy <= 0) continue;
      var tr = k * Math.PI / 3, sway = (1 - E.elastic(seg(t, st2, st2 + 1.1))) * .55;
      var sc = k % 2 ? .9 : 1.25;
      ctx.save(); ctx.rotate(tr); ctx.translate(0, -16 * S); ctx.rotate(sway); ctx.scale(sc * S * Math.max(.05, sx), sc * S * sy);
      leafPath(); ctx.fillStyle = k % 2 ? C.teal : C.pink; ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(0, -26); ctx.lineWidth = 1.3; ctx.strokeStyle = C.indigo; ctx.lineCap = 'round'; ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  var GOLD = 'rgba(255,210,63,';
  function frame(t) {
    var mv = E.inOut(seg(t, 4.85, 5.75));
    var mx = lerp(L.cx, L.fx, mv), my = lerp(L.cy, L.fy, mv), S = lerp(L.S0, L.Sf, mv), R = Math.hypot(W, H);

    // ---- day layer: paper, watercolor, roots, the mark in ink
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);

    // watercolor blots bleed out across the paper
    ctx.globalCompositeOperation = 'source-over';
    blots.forEach(function (b) {
      var p = E.out(seg(t, b.t0, b.t0 + 1.2)); if (p <= 0) return;
      var bx = L.cx + b.x * L.S0 * 120, by = L.cy + b.y * L.S0 * 120, br = b.r * Math.min(W, H) * p;
      for (var j = 0; j < 4; j++) {
        var ox = Math.cos(b.ph + j * 1.7) * br * .25, oy = Math.sin(b.ph + j * 2.3) * br * .25;
        var g = ctx.createRadialGradient(bx + ox, by + oy, 0, bx + ox, by + oy, br * (.7 + j * .12));
        g.addColorStop(0, b.c + '30'); g.addColorStop(.7, b.c + '14'); g.addColorStop(1, b.c + '00');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx + ox, by + oy, br * (.7 + j * .12), 0, 6.29); ctx.fill();
      }
    });
    ctx.globalCompositeOperation = 'source-over';

    // roots branch down from the seed, with colored buds on the tips
    roots.forEach(function (r) {
      var p = E.out(seg(t, r.t0, r.t0 + r.d)); if (p <= 0) return;
      var x1 = mx + r.x * S, y1 = my + r.y * S, x2 = mx + lerp(r.x, r.x2, p) * S, y2 = my + lerp(r.y, r.y2, p) * S;
      ctx.strokeStyle = C.indigo; ctx.globalAlpha = .85; ctx.lineWidth = Math.max(.7, r.w * S * .45); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.globalAlpha = 1;
      if (r.bud) { var bp = E.back(seg(t, r.t0 + r.d, r.t0 + r.d + .3)); if (bp > 0) { ctx.fillStyle = r.bud; ctx.beginPath(); ctx.arc(x2, y2, 2.2 * S * .55 * bp, 0, 6.29); ctx.fill(); } }
    });

    drawMark(t, mx, my, S, false);

    // the seed drops in and bounces, then becomes the yellow center
    var drop = E.bounce(seg(t, 0, .85)), sy = lerp(-30, my, drop);
    var landRing = seg(t, .32, 1.1);
    if (landRing > 0 && landRing < 1) { ctx.strokeStyle = C.indigo; ctx.globalAlpha = (1 - landRing) * .5; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(mx, my + 6 * S, 60 * S * E.out(landRing), 14 * S * E.out(landRing), 0, 0, 6.29); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(mx, t < .85 ? sy : my, 6 * S, 0, 6.29); ctx.fill();

    // ---- night layer: navy ink floods out from the center with a wobbly edge
    var fp = E.inOut(seg(t, 2.85, 3.75));
    if (fp > 0) {
      var fr = fp * R * 1.05;
      ctx.save(); ctx.beginPath();
      for (var a = 0; a <= 96; a++) {
        var ang = a / 96 * 6.283, wob = 1 + .07 * Math.sin(ang * 7 + t * 5) + .05 * Math.sin(ang * 13 - t * 7) + .03 * Math.sin(ang * 23 + t * 3);
        var rr = fr * (fp < 1 ? wob : 1.2);
        a ? ctx.lineTo(mx + Math.cos(ang) * rr, my + Math.sin(ang) * rr) : ctx.moveTo(mx + Math.cos(ang) * rr, my + Math.sin(ang) * rr);
      }
      ctx.closePath(); ctx.fillStyle = C.indigo; ctx.fill(); ctx.clip();

      // glow in the middle of the night
      var gg = ctx.createRadialGradient(mx, my, 0, mx, my, Math.min(W, H) * .55);
      gg.addColorStop(0, 'rgba(46,196,182,.18)'); gg.addColorStop(.5, 'rgba(255,79,154,.08)'); gg.addColorStop(1, 'rgba(18,12,46,0)');
      ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);

      // fireflies drift up and blink
      flies.forEach(function (f) {
        var a2 = seg(t, 3.0, 3.8) * (.35 + .65 * Math.max(0, Math.sin(t * 3 + f.ph)));
        if (a2 <= 0) return;
        var y = ((f.y * H - (t - 2.8) * f.sp) % H + H) % H, x = f.x * W + Math.sin(t * 1.3 + f.ph) * 14;
        ctx.globalAlpha = a2; ctx.fillStyle = f.c; ctx.shadowColor = f.c; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(x, y, f.r, 0, 6.29); ctx.fill();
      });
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;

      drawMark(t, mx, my, S, true);
      ctx.save(); ctx.shadowColor = C.yellow; ctx.shadowBlur = 24 * (1 - mv * .7);
      ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(mx, my, 6 * S, 0, 6.29); ctx.fill(); ctx.restore();
      ctx.restore();
    }

    // ---- blinds: cream slats rise up in a ripple and leave a pink rule under the header
    var N = Math.max(10, Math.round(W / 90)), cw = W / N;
    for (var i = 0; i < N; i++) {
      var d = Math.abs(i - (N - 1) / 2) / ((N - 1) / 2); // ripple outward from the middle
      var st = 4.95 + d * .32, p = E.out(seg(t, st, st + .7)); if (p <= 0) continue;
      var top = lerp(H + 10, L.HH, p);
      ctx.fillStyle = C.pink; ctx.fillRect(i * cw - .5, top - 4, cw + 1, 4);
      ctx.fillStyle = C.cream; ctx.fillRect(i * cw - .5, top, cw + 1, H - top + 10);
    }

    // ---- name: letters drop from above and bounce into place
    letters.forEach(function (s, i) {
      var st = 3.35 + i * .055, dur = s.className === 'dot' ? 1.0 : .8, p = seg(t, st, st + dur);
      if (p <= 0) { s.style.opacity = 0; return; }
      var drop = s.className === 'dot' ? 320 : 200;
      var y = -(1 - E.bounce(p)) * drop, rot = letterRot[i] * (1 - E.out(p));
      s.style.opacity = 1;
      s.style.transform = 'translateY(' + y.toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg)';
    });
    var np = E.inOut(seg(t, 5.0, 5.85));
    nameEl.style.transform = 'translate(' + lerp(L.n0x, L.nfx, np).toFixed(1) + 'px,' + lerp(L.n0y, L.nfy, np).toFixed(1) + 'px)';

    // ---- tagline words slide in from alternating sides, out of a blur
    words.forEach(function (s, i) {
      var p = E.out(seg(t, 4.25 + i * .09, 4.25 + i * .09 + .55));
      s.style.opacity = p.toFixed(3);
      s.style.transform = 'translateX(' + ((1 - p) * (i % 2 ? 46 : -46)).toFixed(1) + 'px)';
      s.style.filter = p < 1 ? 'blur(' + ((1 - p) * 8).toFixed(1) + 'px)' : 'none';
    });
    var tp2 = E.inOut(seg(t, 5.05, 5.9));
    tagEl.style.transform = 'translate(' + lerp(L.t0x, L.tfx, tp2).toFixed(1) + 'px,' + lerp(L.t0y, L.tfy, tp2).toFixed(1) + 'px)';

    hint.style.opacity = t < 2.6 ? 1 : 0;
    controls.classList.toggle('on', t >= END - .3);
  }

  // ---------- run
  var rate = 1, last = 0, tNow = 0, raf = 0;
  function loop(ts) {
    if (!last) last = ts;
    tNow += (ts - last) / 1000 * rate; last = ts;
    frame(Math.min(tNow, END));
    if (tNow < END) raf = requestAnimationFrame(loop); else raf = 0;
  }
  function start(r) { rate = r || 1; tNow = 0; last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }
  function skip() { if (tNow < END) tNow = END; }
  build(); buildText(); size();
  window.addEventListener('resize', function () { size(); if (!raf) frame(END); });
  document.addEventListener('pointerdown', function (e) { if (!e.target.closest('button')) skip(); });
  document.addEventListener('keydown', skip);
  document.getElementById('replay').onclick = function () { start(1); };
  document.getElementById('slow').onclick = function () { start(.35); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { buildText(); size(); });
  if (reduce) frame(END); else start(1);
  window.__seek = function (t) { cancelAnimationFrame(raf); raf = 0; tNow = t; frame(t); };
})();
</script>
</body>
</html>
