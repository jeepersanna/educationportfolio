<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300"><style>
@media (prefers-reduced-motion: no-preference) {
  .w { transform-origin: 0 0; animation: wob ease-in-out infinite; }
  .w1 { animation-duration: 7.4s; }
  .w2 { animation-duration: 5.7s; animation-delay: -2.4s; }
  .w3 { animation-duration: 8.7s; animation-delay: -4.3s; }
  .w4 { animation-duration: 6.6s; animation-delay: -1.3s; }
  .d { animation: bob 7.7s ease-in-out infinite; }
  .d2 { animation-duration: 9s; animation-delay: -3.1s; }
}
@keyframes wob {
  0%, 100% { transform: rotate(0deg); }
  18% { transform: rotate(2.8deg); }
  34% { transform: rotate(-1.1deg); }
  52% { transform: rotate(2deg); }
  70% { transform: rotate(-2.2deg); }
  86% { transform: rotate(.8deg); }
}
@keyframes bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -2px); } }
