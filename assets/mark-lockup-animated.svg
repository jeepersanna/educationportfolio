<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Anna Danielson mark"><style>
@media (prefers-reduced-motion: no-preference) {
  .hub { transform-origin: 60px 60px; animation: pop .3s cubic-bezier(.3,1.7,.5,1) both; }
  .spin { transform-origin: 60px 60px; animation: spin 0.75s 0.05s cubic-bezier(.25,.6,.35,1) both; }
  .ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.25s cubic-bezier(.2,.8,.3,1) both; }
  .tip { transform-box: fill-box; transform-origin: center; animation: pop .3s cubic-bezier(.3,1.8,.5,1) both; }
  .lf { transform-origin: 0 0; animation: sprout .38s cubic-bezier(.3,1.6,.5,1) both; }
}
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes spin {
  from { transform: rotate(-45deg); }
  to { transform: rotate(0deg); }
}
@keyframes sprout { from { transform: scale(0); opacity: 0; } 40% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
