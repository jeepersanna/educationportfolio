<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro experiment: Cyanotype</title>
<!-- Standalone preview. Not linked from the site. Open it in a browser from your site folder. -->
<style>
@font-face { font-family: "Jost"; src: url("assets/jost-latin.woff2") format("woff2"); font-weight: 300 500; font-display: block; }
html, body { margin: 0; height: 100%; background: #FBF4E8; overflow: hidden; font-family: "Jost", system-ui, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.controls { position: fixed; right: 18px; bottom: 18px; display: flex; gap: 8px; opacity: 0; transition: opacity .5s; }
.controls.on { opacity: 1; }
.controls button { font: 500 .75rem/1 "Jost", system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #120C2E; background: transparent; border: 1.5px solid #120C2E; border-radius: 999px; padding: .7em 1.2em; cursor: pointer; }
.controls button:hover { background: #FFD23F; border-color: #FFD23F; }
.hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); font: 500 .65rem/1 "Jost", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: rgba(18,12,46,.35); transition: opacity .4s; }
</style>
</head>
<body>
<h1 class="sr">Anna Danielson</h1>
<p class="sr">Sociology, Child Development, Education</p>
<canvas aria-hidden="true"></canvas>
<div class="hint">click to skip</div>
<div class="controls"><button type="button" id="replay">Replay</button><button type="button" id="slow">Slow-mo</button></div>
<script>
(function () {
  // CYANOTYPE. The mark and name are objects laid on light-sensitive paper. A lamp sweeps across and exposes
  // the sheet; the paper turns, the objects leave their silhouette. Then water runs down the sheet and the
  // print develops: the paper goes to deep navy and color bleeds into the leaves from their stems.
  var END = 5.9, HINT_UNTIL = 3.2, UNRINSED = 'rgb(116,108,70)';
  var grain, drips = [];
  function setup() {
    grain = document.createElement('canvas'); grain.width = W; grain.height = H;
    var g = grain.getContext('2d'); seed = 5;
    for (var i = 0; i < W * H / 55; i++) { g.fillStyle = rnd() < .5 ? 'rgba(18,12,46,.07)' : 'rgba(255,255,255,.13)'; g.fillRect(rnd() * W, rnd() * H, 1.3, 1.3); }
    drips = []; for (var d = 0; d < 9; d++) drips.push({ x: rnd(), len: 26 + rnd() * 70, ph: rnd() * 6.28, w: .8 + rnd() * 1.2 });
  }
  // everything on the sheet in one color, as a stencil
  function silhouette(c, k, col, a, trN) {
    drawMark(c, k.mx, k.my, k.S, { line: col, rib: 'rgba(0,0,0,0)', hub: col, dot: col, leaf: function () { return col; }, lineA: a, leafA: a, hubA: a });
    drawName(c, k.nx, k.ny, k.px, a, trN, { color: col, dot: col });
  }
  function frame(t) {
    var k = lockup(t, 4.85, 5.75, .28, lerp(.5, .24, E.out(seg(t, 4.3, 5.0))));
    // the sheet
    ctx.globalAlpha = 1; ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
    // objects laid down on the paper: a faint shadow under each, since they sit a hair above the sheet
    var laid = E.out(seg(t, .25, .95));
    if (laid > 0 && laid <= 1) { silhouette(ctx, { mx: k.mx + 1.5, my: k.my + 2.5, S: k.S, nx: k.nx + 1.5, ny: k.ny + 2.5, px: k.px }, C.indigo, .08 * laid, .28); silhouette(ctx, k, C.indigo, .11 * laid, .28); }

    // exposure: the lamp sweeps left to right; behind it the paper has turned, except under the objects
    var ex = E.inOut(seg(t, 1.05, 3.05)), sx = lerp(-200, W + 200, ex);
    if (ex > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, sx, H); ctx.clip();
      ctx.fillStyle = UNRINSED; ctx.fillRect(0, 0, W, H);
      silhouette(ctx, k, C.cream, 1, .28);
      ctx.restore();
      if (ex < 1) {
        var g = ctx.createLinearGradient(sx - 110, 0, sx + 130, 0);
        g.addColorStop(0, 'rgba(255,210,63,0)'); g.addColorStop(.42, 'rgba(255,226,120,.5)'); g.addColorStop(.55, 'rgba(255,244,210,.8)'); g.addColorStop(1, 'rgba(255,210,63,0)');
        ctx.fillStyle = g; ctx.fillRect(sx - 110, 0, 240, H);
      }
    }

    // rinse: water sheets down; above the front the print is developed
    var rp = E.inOut(seg(t, 3.2, 4.45)), fy = lerp(-90, H + 90, rp);
    function frontAt(x) { return fy + Math.sin(x * .017 + t * 5) * 8 + Math.sin(x * .0055 - t * 2.2) * 16; }
    if (rp > 0) {
      ctx.save(); ctx.beginPath(); ctx.moveTo(0, -20);
      for (var x = 0; x <= W + 16; x += 16) ctx.lineTo(x, frontAt(x));
      ctx.lineTo(W, -20); ctx.closePath(); ctx.clip();
      ctx.fillStyle = C.indigo; ctx.fillRect(0, 0, W, H);
      // developed print: cream silhouette, with color bleeding into each leaf once the water has passed it
      drawMark(ctx, k.mx, k.my, k.S, { hub: C.cream, leaf: function () { return C.cream; }, leafOver: function (c, kk, sc) {
        var ly = k.my - (16 + 15 * sc) * k.S * Math.cos(kk * Math.PI / 3), p = E.out(seg(fy - ly, -10, 150)); if (p <= 0) return;
        var col = kk % 2 ? C.teal : C.pink; c.save(); leafPath(c); c.clip();
        var gg = c.createRadialGradient(0, -4, 0, 0, -4, 3 + 36 * p); gg.addColorStop(0, col); gg.addColorStop(.7, col); gg.addColorStop(1, rgba(col, 0));
        c.fillStyle = gg; c.fillRect(-12, -32, 24, 34); c.restore();
      } });
      var hp = E.out(seg(fy - k.my, -10, 110));
      if (hp > 0) { ctx.globalAlpha = hp; ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(k.mx, k.my, 6 * k.S, 0, 6.29); ctx.fill(); ctx.globalAlpha = 1; }
      drawName(ctx, k.nx, k.ny, k.px, 1, .28, { dot: C.cream });
      var dp = E.out(seg(fy - k.ny, 10, 120)), dpos = nameDot(ctx, k.nx, k.px, .28);
      if (dp > 0) { ctx.globalAlpha = dp; ctx.fillStyle = C.pink; ctx.beginPath(); ctx.arc(dpos[0], k.ny + dpos[1], k.px * .1, 0, 6.29); ctx.fill(); ctx.globalAlpha = 1; }
      ctx.restore();
      if (rp < 1) {
        // the wet edge, and a few runs racing ahead of it
        ctx.strokeStyle = 'rgba(251,244,232,.45)'; ctx.lineWidth = 1.5; ctx.beginPath();
        for (x = 0; x <= W + 16; x += 16) x ? ctx.lineTo(x, frontAt(x)) : ctx.moveTo(x, frontAt(x));
        ctx.stroke();
        drips.forEach(function (d) {
          var dx = d.x * W, y0 = frontAt(dx), len = d.len * (.6 + .4 * Math.sin(t * 3 + d.ph));
          var g2 = ctx.createLinearGradient(0, y0, 0, y0 + len); g2.addColorStop(0, 'rgba(18,12,46,.55)'); g2.addColorStop(1, 'rgba(18,12,46,.05)');
          ctx.strokeStyle = g2; ctx.lineWidth = d.w; ctx.beginPath(); ctx.moveTo(dx, y0); ctx.lineTo(dx, y0 + len); ctx.stroke();
          ctx.fillStyle = 'rgba(18,12,46,.35)'; ctx.beginPath(); ctx.arc(dx, y0 + len, d.w * 1.3, 0, 6.29); ctx.fill();
        });
      }
    }

    // tagline, and the cream page sliding up under the print
    drawTag(ctx, k.tx, k.ty, k.tpx, seg(t, 4.35, 4.95), lerp(.5, .24, E.out(seg(t, 4.3, 5.0))), function (i) { return seg(t, 4.35 + i * .012, 4.65 + i * .012); });
    page(t, 5.0, 5.85, true);
    // paper grain over everything, lighter once the print is wet
    ctx.globalAlpha = lerp(1, .45, rp); ctx.drawImage(grain, 0, 0); ctx.globalAlpha = 1;
  }

  var cv = document.querySelector('canvas'), ctx = cv.getContext('2d');
  var controls = document.querySelector('.controls'), hint = document.querySelector('.hint');
  var C = { pink: '#FF4F9A', teal: '#2EC4B6', yellow: '#FFD23F', cream: '#FBF4E8', indigo: '#120C2E' };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function cl(x, a, b) { return Math.max(a === undefined ? 0 : a, Math.min(b === undefined ? 1 : b, x)); }
  function seg(t, a, b) { return cl((t - a) / (b - a)); }
  function lerp(a, b, p) { return a + (b - a) * p; }
  var E = {
    out: function (t) { return 1 - Math.pow(1 - t, 3); },
    in: function (t) { return t * t * t; },
    inOut: function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
    sine: function (t) { return -(Math.cos(Math.PI * t) - 1) / 2; },
    back: function (t) { var c = 1.9; return t <= 0 ? 0 : t >= 1 ? 1 : 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  };
  var seed = 5; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function mix(a, b, p) { var A = typeof a === 'string' ? hex(a) : a, B = typeof b === 'string' ? hex(b) : b; return 'rgb(' + Math.round(lerp(A[0], B[0], p)) + ',' + Math.round(lerp(A[1], B[1], p)) + ',' + Math.round(lerp(A[2], B[2], p)) + ')'; }
  function rgba(h, a) { var c = hex(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  // ---------- the mark (120-unit box centered on 0,0), with hooks so each piece can light or build it its own way
  var LINE_A = [-60, 0, 60, 120, 180, 240].map(function (d) { return d * Math.PI / 180; });
  function leafPath(c) { c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(-8, -8, -8, -22, 0, -30); c.bezierCurveTo(8, -22, 8, -8, 0, 0); c.closePath(); }
  function drawMark(c, mx, my, S, o) {
    o = o || {};
    var line = o.line || C.cream, rib = o.rib || C.indigo, hub = o.hub || C.yellow, dotc = o.dot || line;
    var lineA = o.lineA == null ? 1 : o.lineA, leafA = o.leafA == null ? 1 : o.leafA, hubA = o.hubA == null ? 1 : o.hubA, dotA = o.dotA == null ? lineA : o.dotA;
    c.save(); c.translate(mx, my);
    if (lineA > 0) LINE_A.forEach(function (a, i) {
      var p = o.lineP ? o.lineP(i) : 1; if (p <= 0) return;
      c.globalAlpha = lineA; c.strokeStyle = line; c.lineWidth = Math.max(1, S * 1.05); c.lineCap = 'round';
      c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * 46 * S * p, Math.sin(a) * 46 * S * p); c.stroke();
    });
    if (leafA > 0) for (var k = 0; k < 6; k++) {
      var sc = k % 2 ? .9 : 1.25, ls = o.leafS ? o.leafS(k) : [1, 1];
      if (ls[0] <= 0 || ls[1] <= 0) continue;
      c.save(); c.globalAlpha = leafA; c.rotate(k * Math.PI / 3); c.translate(0, -16 * S); c.scale(sc * S * ls[0], sc * S * ls[1]);
      leafPath(c); c.fillStyle = o.leaf ? o.leaf(k) : (k % 2 ? C.teal : C.pink); c.fill();
      if (o.leafOver) o.leafOver(c, k, sc);
      c.beginPath(); c.moveTo(0, -3); c.lineTo(0, -26); c.lineWidth = 1.3; c.lineCap = 'round'; c.strokeStyle = rib; c.stroke();
      c.restore();
    }
    if (dotA > 0) LINE_A.forEach(function (a, i) {
      var p = o.dotP ? o.dotP(i) : 1; if (p <= 0) return;
      c.globalAlpha = dotA; c.fillStyle = dotc; c.beginPath(); c.arc(Math.cos(a) * 46 * S, Math.sin(a) * 46 * S, 2.4 * S * p, 0, 6.29); c.fill();
    });
    if (hubA > 0) { var hp = o.hubP == null ? 1 : o.hubP; if (hp > 0) { c.globalAlpha = hubA; c.fillStyle = hub; c.beginPath(); c.arc(0, 0, 6 * S * hp, 0, 6.29); c.fill(); } }
    c.restore(); c.globalAlpha = 1;
  }

  // ---------- type, set in Jost with tracking that each piece can animate
  var NAME_L = 'ANNA', NAME_R = 'DANIELSON', TAG = 'SOCIOLOGY  •  CHILD DEVELOPMENT  •  EDUCATION';
  function runWidth(c, str, px, tr) { var w = 0; for (var i = 0; i < str.length; i++) w += c.measureText(str[i]).width + px * tr; return w; }
  function nameWidth(c, px, tr) { c.font = '300 ' + px + 'px Jost'; return runWidth(c, NAME_L, px, tr) + px * .7 + runWidth(c, NAME_R, px, tr) - px * tr; }
  function drawName(c, x, y, px, a, tr, o) {
    if (a <= 0) return; o = o || {};
    c.save(); c.font = '300 ' + px + 'px Jost'; c.textBaseline = 'alphabetic'; var i = 0, col = o.color || C.cream;
    function run(str) { for (var j = 0; j < str.length; j++) { c.globalAlpha = a * (o.la ? o.la(i, x) : 1); c.fillStyle = col; c.fillText(str[j], x, y); x += c.measureText(str[j]).width + px * tr; i++; } }
    run(NAME_L);
    c.globalAlpha = a * (o.la ? o.la(i, x) : 1); c.fillStyle = o.dot || C.pink; c.beginPath(); c.arc(x + px * .2, y - px * .36, px * .1, 0, 6.29); c.fill(); x += px * .7; i++;
    run(NAME_R); c.restore(); c.globalAlpha = 1;
  }
  function nameDot(c, x, px, tr) { c.font = '300 ' + px + 'px Jost'; return [x + runWidth(c, NAME_L, px, tr) + px * .2, -px * .36]; }
  function drawTag(c, x, y, px, a, tr, la) {
    if (a <= 0) return;
    c.save(); c.font = '500 ' + px + 'px Jost'; c.fillStyle = C.teal; c.textBaseline = 'alphabetic';
    for (var i = 0; i < TAG.length; i++) { c.globalAlpha = a * (la ? la(i) : 1); c.fillText(TAG[i], x, y); x += c.measureText(TAG[i]).width + px * tr; }
    c.restore(); c.globalAlpha = 1;
  }

  // ---------- layout: centered composition first, top-left lockup at the end
  var W, H, DPR, L = {};
  function layout() {
    DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var phone = W < 700, big = Math.min(W, H) * (phone ? .5 : .4);
    L.phone = phone; L.S0 = big / 120; L.big = big; L.cx = W / 2; L.cy = H * .41;
    L.f0 = Math.round(cl(W * .04, 24, 42)); if (nameWidth(ctx, L.f0, .28) > W * .9) L.f0 = Math.floor(L.f0 * W * .9 / nameWidth(ctx, L.f0, .28));
    L.n0y = L.cy + big / 2 + L.f0 * 1.6; L.tp = Math.max(9, Math.round(L.f0 * .3)); L.t0y = L.n0y + L.f0 * .95;
    L.HH = Math.max(phone ? 360 : 330, H * (phone ? .5 : .46));
    var pad = Math.max(24, (W - 1100) / 2 + 24), fm = phone ? 104 : 168;
    L.Sf = fm / 120; L.f1 = phone ? Math.min(L.f0, 26) : Math.min(L.f0, 34); L.k1 = L.f1 / L.f0;
    if (phone) { L.fx = pad + fm / 2; L.fy = L.HH * .33; L.nfx = pad; L.nfy = L.fy + fm / 2 + L.f1 * 1.5; }
    else { L.fx = pad + fm / 2; L.fy = L.HH / 2; L.nfx = pad + fm + 40; L.nfy = L.fy + L.f1 * .1; }
    L.tfx = L.nfx; L.tfy = L.nfy + L.f1 * .95;
    if (typeof setup === 'function') setup();
  }
  function lockup(t, a, b, trN, trT) {
    var mv = E.inOut(seg(t, a, b)), k = lerp(1, L.k1, mv), px = L.f0 * k, nw = nameWidth(ctx, px, trN);
    var tpx = L.tp * Math.max(k, .85); ctx.font = '500 ' + tpx + 'px Jost'; var tw = runWidth(ctx, TAG, tpx, trT);
    return { mv: mv, mx: lerp(L.cx, L.fx, mv), my: lerp(L.cy, L.fy, mv), S: lerp(L.S0, L.Sf, mv), px: px,
      nx: lerp(W / 2 - nw / 2, L.nfx, mv), ny: lerp(L.n0y, L.nfy, mv), tpx: tpx, tx: lerp(W / 2 - tw / 2, L.tfx, mv), ty: lerp(L.t0y, L.tfy, mv) };
  }
  function page(t, a, b, shadow) {
    var cp = E.inOut(seg(t, a, b)); if (cp <= 0) return 0;
    var top = lerp(H + 10, L.HH, cp);
    if (shadow) { var g = ctx.createLinearGradient(0, top - 18, 0, top); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.28)'); ctx.fillStyle = g; ctx.fillRect(0, top - 18, W, 18); }
    ctx.fillStyle = C.cream; ctx.fillRect(0, top, W, H - top + 10); return cp;
  }

  // ---------- run; the loop keeps going after the intro so anything ambient keeps breathing
  var rate = 1, last = 0, tNow = 0, raf = 0;
  function loop(ts) { if (!last) last = ts; tNow += (ts - last) / 1000 * rate; last = ts; frame(tNow); hint.style.opacity = tNow < HINT_UNTIL ? 1 : 0; controls.classList.toggle('on', tNow >= END - .3); raf = requestAnimationFrame(loop); }
  function start(r) { rate = r || 1; tNow = 0; last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }
  function skip() { if (tNow < END) tNow = END; }
  function go() {
    layout(); window.addEventListener('resize', layout);
    document.addEventListener('pointerdown', function (e) { if (!e.target.closest('button')) skip(); });
    document.addEventListener('keydown', skip);
    document.getElementById('replay').onclick = function () { start(1); };
    document.getElementById('slow').onclick = function () { start(.3); };
    start(1); if (reduce) tNow = END;
  }
  window.__seek = function (t) { cancelAnimationFrame(raf); tNow = t; frame(t); controls.classList.toggle('on', t >= END - .3); hint.style.opacity = t < HINT_UNTIL ? 1 : 0; };
  (document.fonts && document.fonts.load ? Promise.all([document.fonts.load('300 40px Jost'), document.fonts.load('500 12px Jost')]) : Promise.resolve()).then(go, go);

})();
</script>
</body>
</html>
